version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tormag_postgres
    restart: always
    environment:
      TZ: ${TZ:-Asia/Almaty}
      PGTZ: ${TZ:-Asia/Almaty}
      POSTGRES_USER: ${POSTGRES_USER:-tormag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tormag_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tormag}
    # SEC-017: Порт не пробрасывается наружу — доступ только внутри Docker-сети
    # Для локальной работы: docker exec -it tormag_postgres psql -U tormag_user -d tormag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tormag_user} -d ${POSTGRES_DB:-tormag}"]
      interval: 5s
      timeout: 5s
      retries: 5
  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: tormag_postgres_backup
    restart: always
    volumes:
      - db_backups:/backups
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Almaty}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-tormag}
      - POSTGRES_USER=${POSTGRES_USER:-tormag_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tormag_secure_pass}
      - POSTGRES_PORT=5432
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6

  redis:
    image: redis:7-alpine
    container_name: tormag_redis
    restart: always
    environment:
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    # SEC-016: Требуем пароль для Redis. Порт не пробрасывается наружу
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_pass} --loglevel warning

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tormag_telegram_api
    restart: always
    environment:
      TZ: ${TZ:-Asia/Almaty}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - /etc/localtime:/etc/localtime:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tormag_backend
    restart: always
    environment:
      TZ: ${TZ:-Asia/Almaty}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tormag_user}:${POSTGRES_PASSWORD:-tormag_secure_pass}@db:5432/${POSTGRES_DB:-tormag}?schema=public
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-tormag_dev_jwt_secret_local}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-tormag-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.tormag.kz}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_SERVICE_URL: http://ai-service:5005
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      IPX_ALLOWED_HOSTS: ${IPX_ALLOWED_HOSTS:-media.tormag.kz,storage.tssp.kz}

    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bot-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tormag_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ:-Asia/Almaty}
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_YANDEX_MAPS_KEY: ${VITE_YANDEX_MAPS_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: tormag_admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      TZ: ${TZ:-Asia/Almaty}
      VITE_API_PROXY_TARGET: http://backend:5000
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tormag_ai_service
    restart: always
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      TZ: ${TZ:-Asia/Almaty}
      PORT: 5005
      BACKEND_API_URL: http://backend:5000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./ai-service:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  db_backups:
    driver: local
  telegram_bot_api_data:
    driver: local
