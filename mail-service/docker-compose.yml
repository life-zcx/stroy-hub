version: '3.8'

services:
  mail-server:
    image: stalwartlabs/stalwart:latest
    container_name: tormag_mail_server
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${STALWART_SMTP_PORT:-25}:25"       # SMTP Outbound & Inbound
      - "${STALWART_SMTPS_PORT:-465}:465"   # SMTPS (Implicit TLS)
      - "${STALWART_SUBMISSION_PORT:-587}:587" # SMTP Submission (STARTTLS)
      - "${STALWART_IMAP_PORT:-993}:993"     # IMAPS (Implicit TLS)
      - "${STALWART_ADMIN_PORT:-8080}:8080" # Stalwart Admin Web UI
    environment:
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN:-}
    volumes:
      - mail_etc:/etc/stalwart
      - mail_data:/var/lib/stalwart
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: tormag_webmail
    restart: unless-stopped
    ports:
      - "${ROUNDCUBE_PORT:-8090}:80"   # Roundcube Web Interface
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail-server
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail-server
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload
    volumes:
      - webmail_data:/var/www/html
      - webmail_db:/var/roundcube/db
    depends_on:
      - mail-server

volumes:
  webmail_data:
  webmail_db:
