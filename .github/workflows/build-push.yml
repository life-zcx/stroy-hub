name: Build, Push and Deploy (CI/CD)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER_LC: life-zcx
  REPOSITORY_LC: stroy-hub

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and Push Backend Image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPOSITORY_LC }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and Push AI Service Image
      - name: Build and push AI Service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPOSITORY_LC }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build and Push Gateway Image (Nginx + static frontend/admin)
      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPOSITORY_LC }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Continuous Deployment to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment script over SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/stroy-hub || cd /var/www/stroy-hub || cd ./
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh

      - name: Send Telegram Success Notification
        if: ${{ success() && secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          CHAT_ID="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}"
          [ -z "$CHAT_ID" ] && CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          MESSAGE="🚀 *[CI/CD GitHub Actions]* %0A%0A✅ *Успешный деплой Tormag!*%0A📌 *Коммит:* \`${COMMIT_SHORT}\`%0A👤 *Автор:* ${{ github.actor }}%0A💬 *Сообщение:* ${{ github.event.head_commit.message }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

      - name: Send Telegram Failure Notification
        if: ${{ failure() && secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          CHAT_ID="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}"
          [ -z "$CHAT_ID" ] && CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          MESSAGE="🚨 *[CI/CD ERROR]* %0A%0A❌ *Сбой авто-деплоя Tormag!*%0A📌 *Коммит:* \`${COMMIT_SHORT}\`%0A👤 *Автор:* ${{ github.actor }}%0A⚠️ Проверьте логи сборки на GitHub Actions!"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

