services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=14
      - BACKUP_KEEP_WEEKS=8
      - BACKUP_KEEP_MONTHS=12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    image: ghcr.io/life-zcx/stroy-hub/backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      REDIS_URL: redis://redis:6379
      YANDEX_DISK_USER: ${YANDEX_DISK_USER}
      YANDEX_DISK_PASS: ${YANDEX_DISK_PASS}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-tormag-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.tormag.kz}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_SERVICE_URL: http://ai-service:5005

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - db_backups:/app/backups:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    image: ghcr.io/life-zcx/stroy-hub/ai-service:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5005
      BACKEND_API_URL: http://backend:5000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: ghcr.io/life-zcx/stroy-hub/gateway:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"

  mail-server:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: tormag_mail_server
    hostname: mail
    domainname: tormag.kz
    restart: unless-stopped
    ports:
      - "25:25"     # SMTP Outbound & Inbound
      - "465:465"   # SMTPS (Implicit TLS)
      - "587:587"   # SMTP Submission (STARTTLS)
      - "993:993"   # IMAPS (Implicit TLS)
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ONE_DIR=1
      - DMS_TELEMETRY=0

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: tormag_webmail
    restart: unless-stopped
    ports:
      - "8890:80"   # Direct Webmail UI
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mail-server
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=mail-server
      - ROUNDCUBEMAIL_SMTP_PORT=25
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload
    volumes:
      - webmail_data:/var/www/html
      - webmail_db:/var/roundcube/db
    depends_on:
      - mail-server

volumes:
  postgres_data:
  backend_uploads:
  db_backups:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  webmail_data:
  webmail_db:
